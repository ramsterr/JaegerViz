[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-topology-manager"
version = "1.0.0"
description = "Trace-based microservice dependency graph visualizer"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "networkx>=3.0",
    "pyvis>=0.3",
    "graphviz>=0.20",
    "numpy>=1.24",
    "click>=8.1",
]

[project.scripts]
topology-map = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
